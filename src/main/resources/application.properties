spring.application.name=atm

# 1. Notice there is NO username:password@ inside the URL! It starts straight at ep-super-block...
spring.datasource.url=

# 2. Your Neon Username goes on its own line here:
spring.datasource.username=

# 3. Your Neon Password goes on its own line here:
spring.datasource.password=

# 4. Automatically create/update tables and print the SQL in the console:
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true